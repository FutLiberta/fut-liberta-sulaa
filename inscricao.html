<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição - Fut Liberta/Sula</title>

    <link rel="stylesheet" href="inscricao.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* Notificação */
        #msg-sucesso {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #0f0;
            padding: 15px 20px;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: 0.4s;
            z-index: 999;
        }

        #msg-sucesso.show {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>

<body>

    <div id="msg-sucesso" class="notificacao">Inscrição enviada com sucesso! Em breve entraremos em contato para finalizar a ultima parte de sua inscrição.</div>

    <div class="background-overlay">

        <header class="header">
            <div class="logo-container">
                <img src="logo-campeonato.jpg" class="logo-img" alt="logo">
                <h1 class="logo">Fut Liberta/Sula</h1>
            </div>

            <nav class="nav">
                <a href="index.html">Início</a>
                <a href="contato.html">Contato</a>
            </nav>
        </header>

        <main class="form-area">
            <h2>Ficha de Inscrição</h2>

            <form class="form-inscricao" id="formInscricao">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" maxlength="14" placeholder="000.000.000-00" required>

                <label for="telefone">Telefone:</label>
                <input type="text" id="telefone" name="telefone" maxlength="11" required>

                <label for="nascimento">Data de Nascimento:</label>
                <input type="text" id="nascimento" name="nascimento" maxlength="10" placeholder="DD/MM/AAAA" required>

                <label for="posicoes">Posição (máximo 2):</label>
                <div id="posicoes">
                    <button type="button" class="pos-btn" data-value="Goleiro">Goleiro</button>
                    <button type="button" class="pos-btn" data-value="Fixo">Fixo</button>
                    <button type="button" class="pos-btn" data-value="Ala">Ala</button>
                    <button type="button" class="pos-btn" data-value="Pivô">Pivô</button>
                </div>

                <input type="hidden" name="posicoes" id="posicoesInput">

                <button type="submit" class="btn-enviar">Enviar</button>
            </form>
        </main>

        <footer class="footer">
            <p>&copy; 2025 Fut Liberta/Sula</p>
        </footer>

    </div>

    <!-- SCRIPT GERAL -->
<script>

    /* --- Máscaras e validações (mantém igual ao seu) --- */
    /* ... seu código das máscaras ... */

    // =========================
// VALIDAÇÕES DOS CAMPOS
// =========================

// NOME — apenas letras e espaços
const nome = document.getElementById("nome");
nome.addEventListener("input", () => {
    nome.value = nome.value.replace(/[0-9]/g, "");
});

// CPF — apenas números + máscara automática
const cpf = document.getElementById("cpf");
cpf.addEventListener("input", () => {
    cpf.value = cpf.value.replace(/\D/g, "") // tira tudo que não é número
                         .substring(0, 11);  // limita a 11 dígitos
});

// TELEFONE — apenas números (limite 11)
const telefone = document.getElementById("telefone");
telefone.addEventListener("input", () => {
    telefone.value = telefone.value.replace(/\D/g, "").substring(0, 11);
});

// DATA DE NASCIMENTO — bloqueia letras e formata DD/MM/AAAA
const nasc = document.getElementById("nascimento");
nasc.addEventListener("input", () => {
    let v = nasc.value.replace(/\D/g, "").substring(0, 8); 

    if (v.length >= 5)
        nasc.value = v.replace(/(\d{2})(\d{2})(\d{0,4})/, "$1/$2/$3");
    else if (v.length >= 3)
        nasc.value = v.replace(/(\d{2})(\d{0,2})/, "$1/$2");
    else
        nasc.value = v;
});

// Impedir envio se algo estiver inválido
formInscricao.addEventListener("submit", (e) => {

    if (nome.value.trim().length < 3) {
        alert("Digite um nome válido.");
        e.preventDefault();
        return;
    }

    if (cpf.value.length !== 11) {
        alert("Digite um CPF válido com 11 números.");
        e.preventDefault();
        return;
    }

    if (telefone.value.length < 8) {
        alert("Digite um telefone válido (no mínimo 8 dígitos).");
        e.preventDefault();
        return;
    }

    if (nasc.value.length !== 10) {
        alert("Digite uma data de nascimento no formato DD/MM/AAAA.");
        e.preventDefault();
        return;
    }
});


    /* Seleção de posições (mantém igual ao seu) */
    const buttons = document.querySelectorAll(".pos-btn");
    const hiddenInput = document.getElementById("posicoesInput");

    buttons.forEach(btn => {
        btn.addEventListener("click", () => {

            if (btn.classList.contains("selected")) {
                btn.classList.remove("selected");
            } else {
                if (document.querySelectorAll(".pos-btn.selected").length >= 2) {
                    alert("Você só pode selecionar no máximo 2 posições.");
                    return;
                }
                btn.classList.add("selected");
            }

            const selecionadas = [...document.querySelectorAll(".pos-btn.selected")]
                .map(b => b.dataset.value);

            hiddenInput.value = selecionadas.join(", ");
        });
    });


    /* --- Envio + animação do botão --- */

    const scriptURL = "https://script.google.com/macros/s/AKfycbzixQ9MBEItJO6OxYjOJ_pSHjgrtWYJ877e9kYjsv8KorEix8VPGgQ6LgnJykRTpZG7TA/exec";
    const form = document.getElementById("formInscricao");
    const enviarBtn = document.querySelector(".btn-enviar");

    form.addEventListener("submit", async function (e) {
        e.preventDefault();

        // impede clicar 2x, mas sem deixar fosco
        enviarBtn.style.pointerEvents = "none";

        // muda para enviando
        enviarBtn.innerText = "Enviando...";

        // espera 1 segundo
        await new Promise(resolve => setTimeout(resolve, 1000));

        try {
            await fetch(scriptURL, {
                method: "POST",
                body: new FormData(form)
            });

            // muda para enviado
            enviarBtn.innerText = "Enviado ✓";

            // mostra notificação
            const msg = document.getElementById("msg-sucesso");
            msg.classList.add("show");
            setTimeout(() => msg.classList.remove("show"), 3000);

            // reseta formulário
            form.reset();
            buttons.forEach(b => b.classList.remove("selected"));

        } catch (error) {
            enviarBtn.innerText = "Erro, tente novamente";
            enviarBtn.style.pointerEvents = "auto"; // libera de novo
            console.log(error);
        }
    });

</script>


</body>

</html>
