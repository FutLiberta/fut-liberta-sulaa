<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição - Fut Liberta/Sula</title>
    <link rel="stylesheet" href="inscricao.css">
</head>
<body>

<header>
    <div class="logo">
        <img src="imagens/logo.png" alt="Logo Fut Liberta/Sula">
    </div>
    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="campliberta.html">Campeões da Liberta</a></li>
            <li><a href="campsula.html">Campeões da Sula</a></li>
            <li><a href="inscricao.html" class="ativo">Inscrição</a></li>
        </ul>
    </nav>
</header>

<div class="container">
    <h1>Ficha de Inscrição</h1>
    <p class="sub">Preencha os dados abaixo para participar do Fut Liberta/Sula.</p>

    <form class="formulario">
        <label>Nome Completo:</label>
        <input type="text" name="nome" placeholder="Digite seu nome" required>

        <label>Posição:</label>
        <select name="posicao" required>
            <option value="">Selecione</option>
            <option>Goleiro</option>
            <option>Zagueiro</option>
            <option>Lateral</option>
            <option>Volante</option>
            <option>Meia</option>
            <option>Atacante</option>
            <option>Ala</option>
            <option>Fixo</option>
            <option>Pivô</option>
        </select>

        <label>Data de Nascimento:</label>
        <input type="date" name="nascimento" required>

        <label>CPF:</label>
        <input type="text" name="cpf" placeholder="000.000.000-00" required>

        <button type="submit" class="btn">Enviar Inscrição</button>
    </form>
</div>

</body>
</html>
