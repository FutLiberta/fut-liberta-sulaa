<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Galeria de Campeões - Fut Liberta/Sula</title>
  <link rel="stylesheet" href="campeões.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="logo-campeonato.jpg" type="image/jpeg" />
</head>
<body>
  <div class="background-overlay">

    <header class="header">
      <div class="logo-container">

      </div>
      <nav class="nav">
        <a href="index.html">Início</a>
      </nav>
    </header>

    <main class="hero">
      <div class="hero-content">
        <h2>Galeria de Campeões</h2>

        <div class="buttons-container">

                      <!-- Botão da Liberta -->
          <div class="champion-card">
            <img src="taçaliberta-removebg-preview.png" alt="Taça da Liberta" class="champion-img">
            <a href="campliberta.html" class="btn">Campeões da Liberta</a>
          </div>

          <!-- Botão da Sula -->
          <div class="champion-card">
            <img src="sul-americanas_conmebol-removebg-preview.png" alt="Taça da Sula" class="champion-img">
            <a href="campsula.html" class="btn btn-sula">Campeões da Sula</a>

        </div>
      </div>

    <footer class="footer">
      <p>&copy; 2025 Fut Liberta/Sula</p>
